<!DOCTYPE html>
<html>
  <body>
    <h2>JavaScript Objects Data Structure and Array</h2>
    <script>
        var student = {
            name: 'Jagravi',
            age: '14',
            class: '9th',
            hobbies: 'playing',
            school: 'Visakha Valley School',
            fav_sport: 'badminton'
         };
         var color = ["white", "black", "lavender", "sea green", "cyan"];
         document.write("student name is : " + student.name, "<br>", "Student favorite sport is : " + student.fav_sport);
         document.write("<br>Before Poping the colors ae :" + color.join("^"));
         document.write("<br>My favorite color is : " + color[3]);
         color.pop();
         document.write("<br>After poping the colors are : " + color.join("*"));
    </script>
    </body>
    </html>
